<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 470" width="300" height="470">
  <!-- Car from above: doors, trunk, seats with occupant and seat belt. IDs use the prefix `car-`.
       Colors are presentation attributes, so that the runtime's inline styles take effect. -->
  <rect x="0" y="0" width="300" height="470" rx="16" fill="#f1f5f9" />

  <g id="car-wheels" fill="#1f2937">
    <rect x="58" y="88" width="16" height="46" rx="4" />
    <rect x="226" y="88" width="16" height="46" rx="4" />
    <rect x="58" y="340" width="16" height="46" rx="4" />
    <rect x="226" y="340" width="16" height="46" rx="4" />
  </g>

  <path id="car-body" d="M 96 30 C 120 22, 180 22, 204 30 C 222 36, 230 50, 230 80 L 230 400 C 230 425, 218 440, 196 444 C 170 448, 130 448, 104 444 C 82 440, 70 425, 70 400 L 70 80 C 70 50, 78 36, 96 30 Z" fill="#e2e8f0" stroke="#334155" stroke-width="3" />
  <ellipse cx="62" cy="142" rx="9" ry="5" fill="#e2e8f0" stroke="#334155" stroke-width="2" />
  <ellipse cx="238" cy="142" rx="9" ry="5" fill="#e2e8f0" stroke="#334155" stroke-width="2" />
  <path d="M 96 60 Q 150 50 204 60" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.5" />
  <path d="M 86 118 Q 150 104 214 118 L 204 148 Q 150 138 96 148 Z" fill="#93c5fd" stroke="#334155" stroke-width="2" />
  <rect x="84" y="150" width="132" height="198" rx="10" fill="#cbd5e1" />
  <path d="M 96 352 Q 150 360 204 352 L 212 382 Q 150 394 88 382 Z" fill="#93c5fd" stroke="#334155" stroke-width="2" />
  <path id="car-trunk" d="M 92 396 L 208 396 C 212 420 204 436 196 438 C 170 442 130 442 104 438 C 96 436 88 420 92 396 Z" fill="#e2e8f0" stroke="#334155" stroke-width="2" />

  <g id="car-door-openings" fill="#0f172a">
    <rect x="70" y="150" width="12" height="96" rx="2" />
    <rect x="70" y="250" width="12" height="92" rx="2" />
    <rect x="218" y="150" width="12" height="96" rx="2" />
    <rect x="218" y="250" width="12" height="92" rx="2" />
  </g>

  <g id="car-seats">
    <g id="car-seat-dr">
      <rect x="94" y="160" width="44" height="50" rx="8" fill="#64748b" />
      <rect x="92" y="208" width="48" height="16" rx="6" fill="#475569" />
    </g>
    <g id="car-person-dr" fill="#16a34a" opacity="1">
      <rect x="105" y="168" width="9" height="30" rx="4" />
      <rect x="118" y="168" width="9" height="30" rx="4" />
      <ellipse cx="116" cy="208" rx="18" ry="9" />
      <circle cx="116" cy="205" r="8" stroke="#0f172a" stroke-opacity="0.35" stroke-width="1.5" />
    </g>
    <!-- 3-point belt: outer shoulder, buckle at the inner hip, outer hip -->
    <polyline id="car-belt-dr" points="100,212 127,184 102,184" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" />
    <g id="car-seat-pa">
      <rect x="162" y="160" width="44" height="50" rx="8" fill="#64748b" />
      <rect x="160" y="208" width="48" height="16" rx="6" fill="#475569" />
    </g>
    <g id="car-person-pa" fill="#dc2626" opacity="0">
      <rect x="173" y="168" width="9" height="30" rx="4" />
      <rect x="186" y="168" width="9" height="30" rx="4" />
      <ellipse cx="184" cy="208" rx="18" ry="9" />
      <circle cx="184" cy="205" r="8" stroke="#0f172a" stroke-opacity="0.35" stroke-width="1.5" />
    </g>
    <!-- 3-point belt: outer shoulder, buckle at the inner hip, outer hip -->
    <polyline id="car-belt-pa" points="200,212 173,184 198,184" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0" />
    <g id="car-seat-rl">
      <rect x="86" y="264" width="40" height="50" rx="8" fill="#64748b" />
      <rect x="84" y="312" width="44" height="16" rx="6" fill="#475569" />
    </g>
    <g id="car-person-rl" fill="#dc2626" opacity="0">
      <rect x="95" y="272" width="9" height="30" rx="4" />
      <rect x="108" y="272" width="9" height="30" rx="4" />
      <ellipse cx="106" cy="312" rx="18" ry="9" />
      <circle cx="106" cy="309" r="8" stroke="#0f172a" stroke-opacity="0.35" stroke-width="1.5" />
    </g>
    <!-- 3-point belt: outer shoulder, buckle at the inner hip, outer hip -->
    <polyline id="car-belt-rl" points="90,316 117,288 92,288" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0" />
    <g id="car-seat-rm">
      <rect x="130" y="264" width="40" height="50" rx="8" fill="#64748b" />
      <rect x="128" y="312" width="44" height="16" rx="6" fill="#475569" />
    </g>
    <g id="car-person-rm" fill="#dc2626" opacity="0">
      <rect x="139" y="272" width="9" height="30" rx="4" />
      <rect x="152" y="272" width="9" height="30" rx="4" />
      <ellipse cx="150" cy="312" rx="18" ry="9" />
      <circle cx="150" cy="309" r="8" stroke="#0f172a" stroke-opacity="0.35" stroke-width="1.5" />
    </g>
    <!-- 3-point belt: outer shoulder, buckle at the inner hip, outer hip -->
    <polyline id="car-belt-rm" points="166,316 139,288 164,288" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0" />
    <g id="car-seat-rr">
      <rect x="174" y="264" width="40" height="50" rx="8" fill="#64748b" />
      <rect x="172" y="312" width="44" height="16" rx="6" fill="#475569" />
    </g>
    <g id="car-person-rr" fill="#dc2626" opacity="0">
      <rect x="183" y="272" width="9" height="30" rx="4" />
      <rect x="196" y="272" width="9" height="30" rx="4" />
      <ellipse cx="194" cy="312" rx="18" ry="9" />
      <circle cx="194" cy="309" r="8" stroke="#0f172a" stroke-opacity="0.35" stroke-width="1.5" />
    </g>
    <!-- 3-point belt: outer shoulder, buckle at the inner hip, outer hip -->
    <polyline id="car-belt-rr" points="210,316 183,288 208,288" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0" />
  </g>

  <g id="car-doors">
    <g id="car-door-fl">
      <rect id="car-door-fl-panel" x="70" y="150" width="12" height="96" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="2" />
      <rect x="72" y="228" width="8" height="3" rx="1.5" fill="#475569" />
    </g>
    <g id="car-door-rl">
      <rect id="car-door-rl-panel" x="70" y="250" width="12" height="92" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="2" />
      <rect x="72" y="324" width="8" height="3" rx="1.5" fill="#475569" />
    </g>
    <g id="car-door-fr">
      <rect id="car-door-fr-panel" x="218" y="150" width="12" height="96" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="2" />
      <rect x="220" y="228" width="8" height="3" rx="1.5" fill="#475569" />
    </g>
    <g id="car-door-rr">
      <rect id="car-door-rr-panel" x="218" y="250" width="12" height="92" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="2" />
      <rect x="220" y="324" width="8" height="3" rx="1.5" fill="#475569" />
    </g>
  </g>
</svg>
