<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Racing line: followed by the cars (motion-path) and drawn several times via <use> -->
    <path id="gp-track" d="M160 410 L560 410 C650 410 720 370 720 300 C720 240 670 215 620 225 C560 238 540 200 560 160 C580 120 640 120 660 90 C680 55 640 40 600 40 L260 40 C160 40 120 80 140 130 C160 180 260 170 300 210 C340 250 280 290 220 280 C140 268 80 300 80 350 C80 390 110 410 160 410 Z" />
    <pattern id="gp-checker" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#ffffff" />
      <rect width="4" height="4" fill="#111827" />
      <rect x="4" y="4" width="4" height="4" fill="#111827" />
    </pattern>
    <radialGradient id="gp-grass-grad" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#4d9a45" />
      <stop offset="1" stop-color="#2f6b2c" />
    </radialGradient>
    <!-- Race car from above, nose to the right (direction of travel = positive x), centred on 0,0.
         The team colour comes from the color attribute of the <use> (currentColor). -->
    <g id="gp-car-shape">
      <ellipse cx="1" cy="1.5" rx="15" ry="7.5" fill="#000000" opacity="0.25" />
      <!-- Wheels -->
      <rect x="-10.5" y="-8" width="6.5" height="3.6" rx="1.2" fill="#111111" />
      <rect x="-10.5" y="4.4" width="6.5" height="3.6" rx="1.2" fill="#111111" />
      <rect x="5" y="-7.4" width="5.5" height="3.2" rx="1.1" fill="#111111" />
      <rect x="5" y="4.2" width="5.5" height="3.2" rx="1.1" fill="#111111" />
      <!-- Axles -->
      <path d="M -7 -4.5 V 4.5 M 7.5 -4.2 V 4.2" stroke="#2b2b2b" stroke-width="1.2" />
      <!-- Rear wing -->
      <rect x="-14.5" y="-6.5" width="3.5" height="13" rx="0.8" fill="currentColor" />
      <rect x="-14.5" y="-6.5" width="1.2" height="13" fill="#000000" opacity="0.35" />
      <!-- Sidepods and body -->
      <rect x="-8" y="-4.6" width="9" height="9.2" rx="2.6" fill="currentColor" />
      <path d="M -12 -2.6 L -3 -3.6 L 5 -2 L 13.5 -0.9 L 13.5 0.9 L 5 2 L -3 3.6 L -12 2.6 Z" fill="currentColor" />
      <path d="M -10 -0.8 L 13 -0.4 L 13 0.4 L -10 0.8 Z" fill="#ffffff" opacity="0.55" />
      <!-- Front wing -->
      <rect x="11.5" y="-6.2" width="2.6" height="12.4" rx="0.8" fill="currentColor" />
      <rect x="13.2" y="-6.2" width="0.9" height="12.4" fill="#ffffff" opacity="0.4" />
      <!-- Cockpit and helmet -->
      <ellipse cx="-1" cy="0" rx="3.4" ry="2" fill="#111111" />
      <circle cx="-1.6" cy="0" r="1.5" fill="#f8fafc" />
    </g>
  </defs>

  <!-- Grass and run-off -->
  <rect width="800" height="500" fill="url(#gp-grass-grad)" />
  <use href="#gp-track" fill="none" stroke="#d6c9a3" stroke-width="54" stroke-linejoin="round" />

  <!-- Kerbs, asphalt and track lights (colored by the flag) -->
  <use href="#gp-track" fill="none" stroke="#ffffff" stroke-width="36" stroke-linejoin="round" />
  <use href="#gp-track" fill="none" stroke="#dc2626" stroke-width="36" stroke-dasharray="10 10" stroke-linejoin="round" />
  <use href="#gp-track" fill="none" stroke="#3f3f46" stroke-width="28" stroke-linejoin="round" />
  <use id="gp-track-lights" href="#gp-track" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="14 10" stroke-linejoin="round" opacity="0.9" />

  <!-- Start/finish line and pit wall -->
  <rect x="156" y="396" width="8" height="28" fill="url(#gp-checker)" />
  <rect x="200" y="436" width="300" height="6" rx="3" fill="#9ca3af" />
  <text x="350" y="462" font-size="11" fill="#e5e7eb" text-anchor="middle" letter-spacing="2">BOXENGASSE</text>

  <!-- Title and legend -->
  <g transform="translate(320 78)">
    <text x="0" y="0" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="1">SEPIA-RING</text>
    <text x="0" y="18" font-size="11" fill="#d1fae5">Großer Preis der Tintenfische</text>
    <circle cx="6" cy="40" r="6" fill="#e11d48" />
    <text x="18" y="44" font-size="12" fill="#ffffff">Wagen 1</text>
    <circle cx="86" cy="40" r="6" fill="#2563eb" />
    <text x="98" y="44" font-size="12" fill="#ffffff">Wagen 2</text>
    <circle cx="166" cy="40" r="6" fill="#f59e0b" />
    <text x="178" y="44" font-size="12" fill="#ffffff">Wagen 3</text>
  </g>

  <!-- Race control panel in the infield -->
  <g transform="translate(340 250)">
    <rect width="190" height="120" rx="10" fill="#111827" opacity="0.88" />
    <text x="16" y="28" font-size="11" fill="#9ca3af" letter-spacing="1.5">RUNDE</text>
    <text id="gp-lap-value" x="16" y="62" font-size="32" font-weight="700" fill="#ffffff">1</text>
    <text x="100" y="62" font-size="18" fill="#9ca3af" text-anchor="end">/ 58</text>
    <rect id="gp-flag-panel" x="16" y="78" width="158" height="28" rx="6" fill="#16a34a" />
    <text id="gp-flag-text" x="95" y="97" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">GRÜNE FLAGGE</text>
  </g>

  <!-- Cars; drawn on the start straight pointing in the direction of travel (right). The runtime
       places them on the racing line and turns them with its direction (orient). -->
  <g id="gp-car-3" transform="translate(205 410)">
    <use href="#gp-car-shape" color="#f59e0b" />
    <text x="-8.5" y="1.8" font-size="5" font-weight="700" fill="#111827" text-anchor="middle">3</text>
  </g>
  <g id="gp-car-2" transform="translate(250 410)">
    <use href="#gp-car-shape" color="#2563eb" />
    <text x="-8.5" y="1.8" font-size="5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  </g>
  <g id="gp-car-1" transform="translate(295 410)">
    <use href="#gp-car-shape" color="#e11d48" />
    <text x="-8.5" y="1.8" font-size="5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  </g>
</svg>
