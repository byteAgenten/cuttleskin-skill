<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect width="800" height="500" fill="#f8fafc" />

  <!-- Water at the south-east, purely decorative -->
  <path d="M800 300 C720 320 690 380 640 420 C600 452 560 470 520 500 L800 500 Z" fill="#dbeafe" />

  <!-- White casing below the lines, so crossings read as separate lines -->
  <g fill="none" stroke="#ffffff" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
    <path d="M60 250 L560 250 L660 150 L740 150" />
    <path d="M300 60 L400 160 L400 380 L470 450" />
    <path d="M120 420 L210 330 L510 330 L510 100 L570 40" />
  </g>

  <!-- Lines; the trains follow these paths (motion-path) -->
  <path id="um-line-u3" d="M120 420 L210 330 L510 330 L510 100 L570 40" fill="none" stroke="#16a34a" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
  <path id="um-line-u2" d="M300 60 L400 160 L400 380 L470 450" fill="none" stroke="#2563eb" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
  <path id="um-line-u1" d="M60 250 L560 250 L660 150 L740 150" fill="none" stroke="#dc2626" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Stations -->
  <g fill="#ffffff" stroke="#1f2937" stroke-width="2.5">
    <circle cx="60" cy="250" r="5.5" />
    <circle cx="170" cy="250" r="5.5" />
    <circle cx="290" cy="250" r="5.5" />
    <circle cx="610" cy="200" r="5.5" />
    <circle cx="740" cy="150" r="5.5" />
    <circle cx="300" cy="60" r="5.5" />
    <circle cx="400" cy="160" r="5.5" />
    <circle cx="470" cy="450" r="5.5" />
    <circle cx="120" cy="420" r="5.5" />
    <circle cx="210" cy="330" r="5.5" />
    <circle cx="510" cy="130" r="5.5" />
    <circle cx="570" cy="40" r="5.5" />
  </g>
  <!-- Interchange stations -->
  <g fill="#ffffff" stroke="#111827" stroke-width="3">
    <circle cx="400" cy="250" r="9" />
    <circle cx="400" cy="330" r="9" />
    <circle cx="510" cy="250" r="9" />
  </g>

  <!-- Station names -->
  <g font-size="12" fill="#1f2937">
    <text x="60" y="276" text-anchor="middle">Westkap</text>
    <text x="170" y="276" text-anchor="middle">Muschelweg</text>
    <text x="290" y="276" text-anchor="middle">Hafenmarkt</text>
    <text x="388" y="238" text-anchor="end" font-weight="700">Tintenplatz</text>
    <text x="522" y="270" font-weight="700">Kalmarstraße</text>
    <text x="622" y="214">Sepiapark</text>
    <text x="740" y="176" text-anchor="middle">Ostmole</text>
    <text x="288" y="64" text-anchor="end">Nordbucht</text>
    <text x="412" y="164">Leuchtturm</text>
    <text x="388" y="352" text-anchor="end" font-weight="700">Korallenring</text>
    <text x="482" y="454">Südstrand</text>
    <text x="120" y="446" text-anchor="middle">Algenhain</text>
    <text x="198" y="320" text-anchor="end">Riffstraße</text>
    <text x="522" y="134">Perlenhöhe</text>
    <text x="582" y="44">Nordwerft</text>
  </g>

  <!-- Disruption marker on U2, shown by u2Disrupted -->
  <g id="um-u2-warning" opacity="0">
    <path d="M440 92 L458 124 L422 124 Z" fill="#facc15" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" />
    <text x="440" y="120" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">!</text>
  </g>

  <!-- Legend and status -->
  <g transform="translate(590 330)">
    <rect width="190" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0" />
    <text x="16" y="26" font-size="15" font-weight="700" fill="#111827">Sepiastadt</text>
    <text x="16" y="42" font-size="10" fill="#64748b" letter-spacing="1">LINIENNETZ</text>
    <rect x="16" y="56" width="26" height="14" rx="4" fill="#dc2626" />
    <text x="29" y="67" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">U1</text>
    <text x="50" y="67" font-size="11" fill="#1f2937">Westkap – Ostmole</text>
    <rect x="16" y="76" width="26" height="14" rx="4" fill="#2563eb" />
    <text x="29" y="87" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">U2</text>
    <text x="50" y="87" font-size="11" fill="#1f2937">Nordbucht – Südstrand</text>
    <rect x="16" y="96" width="26" height="14" rx="4" fill="#16a34a" />
    <text x="29" y="107" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">U3</text>
    <text x="50" y="107" font-size="11" fill="#1f2937">Algenhain – Nordwerft</text>
    <circle id="um-status-dot" cx="21" cy="131" r="5" fill="#16a34a" />
    <text id="um-status-text" x="32" y="135" font-size="11" fill="#1f2937">Alle Linien in Betrieb</text>
  </g>

  <!-- Trains; drawn at their default positions, the runtime places them on their line -->
  <g id="um-train-u3" transform="translate(510 214)">
    <rect x="-13" y="-8" width="26" height="16" rx="5" fill="#16a34a" stroke="#ffffff" stroke-width="2" />
    <text y="3.5" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">U3</text>
  </g>
  <g id="um-train-u2" transform="translate(400 282)">
    <rect x="-13" y="-8" width="26" height="16" rx="5" fill="#2563eb" stroke="#ffffff" stroke-width="2" />
    <text y="3.5" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">U2</text>
  </g>
  <g id="um-train-u1-a" transform="translate(230 250)">
    <rect x="-13" y="-8" width="26" height="16" rx="5" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    <text y="3.5" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">U1</text>
  </g>
  <g id="um-train-u1-b" transform="translate(576 234)">
    <rect x="-13" y="-8" width="26" height="16" rx="5" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    <text y="3.5" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">U1</text>
  </g>
</svg>
