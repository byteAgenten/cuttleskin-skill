
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sp-depth-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="0.45" stop-color="#000814" stop-opacity="0" />
      <stop offset="1" stop-color="#000814" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="sp-ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8fbff" stop-opacity="0.9" />
      <stop offset="1" stop-color="#e8fbff" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="sp-ink-gradient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#05030a" stop-opacity="0.95" />
      <stop offset="0.6" stop-color="#0d0814" stop-opacity="0.7" />
      <stop offset="1" stop-color="#0d0814" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sp-glow-dot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b8fff4" />
      <stop offset="0.35" stop-color="#4ff5d8" stop-opacity="0.8" />
      <stop offset="1" stop-color="#4ff5d8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sp-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2233" stop-opacity="0.72" />
      <stop offset="1" stop-color="#04121d" stop-opacity="0.82" />
    </linearGradient>
    <linearGradient id="sp-volume" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.38" />
    </linearGradient>
    <clipPath id="sp-mantle-clip">
      <path d="M 340 260 C 340 205 420 195 500 200 C 560 204 602 230 602 260 C 602 290 560 316 500 320 C 420 325 340 315 340 260 Z" />
    </clipPath>
    <clipPath id="sp-scene-clip">
      <rect width="800" height="500" rx="18" />
    </clipPath>
  </defs>

  <g clip-path="url(#sp-scene-clip)">
    <!-- Water: its colour follows the daylight -->
    <rect id="sp-water" width="800" height="500" fill="#0f6f8c" />
    <rect width="800" height="500" fill="url(#sp-depth-shade)" />

    <!-- Sun rays from the surface -->
    <g id="sp-rays" opacity="0.5">
      <polygon points="120,0 190,0 330,500 230,500" fill="url(#sp-ray)" opacity="0.35" />
      <polygon points="300,0 340,0 470,500 400,500" fill="url(#sp-ray)" opacity="0.25" />
      <polygon points="470,0 540,0 700,500 590,500" fill="url(#sp-ray)" opacity="0.3" />
      <polygon points="640,0 670,0 800,420 800,500 760,500" fill="url(#sp-ray)" opacity="0.2" />
    </g>

    <!-- Bioluminescent plankton, visible in the dark -->
    <g id="sp-glow" opacity="0">
      <circle cx="80" cy="120" r="6" fill="url(#sp-glow-dot)" />
      <circle cx="160" cy="70" r="4" fill="url(#sp-glow-dot)" />
      <circle cx="240" cy="160" r="5" fill="url(#sp-glow-dot)" />
      <circle cx="610" cy="90" r="6" fill="url(#sp-glow-dot)" />
      <circle cx="700" cy="160" r="4" fill="url(#sp-glow-dot)" />
      <circle cx="745" cy="60" r="5" fill="url(#sp-glow-dot)" />
      <circle cx="520" cy="60" r="3" fill="url(#sp-glow-dot)" />
      <circle cx="660" cy="330" r="5" fill="url(#sp-glow-dot)" />
      <circle cx="720" cy="270" r="3" fill="url(#sp-glow-dot)" />
      <circle cx="420" cy="110" r="4" fill="url(#sp-glow-dot)" />
      <circle cx="60" cy="300" r="4" fill="url(#sp-glow-dot)" />
      <circle cx="190" cy="360" r="3" fill="url(#sp-glow-dot)" />
    </g>

    <!-- Sea bed with seagrass -->
    <g id="sp-seabed" fill="#0a3a40">
      <path d="M 0 440 C 120 420 220 450 340 438 C 470 425 560 452 680 436 C 740 428 780 432 800 436 L 800 500 L 0 500 Z" />
      <path d="M 640 440 C 630 400 650 370 640 330 C 660 370 652 400 660 440 Z" />
      <path d="M 662 440 C 668 410 690 390 688 360 C 700 395 682 415 676 440 Z" />
      <path d="M 700 438 C 696 412 712 396 706 372 C 722 398 712 416 714 438 Z" />
      <path d="M 90 436 C 84 404 100 384 92 352 C 110 386 102 410 106 436 Z" />
      <path d="M 112 436 C 120 412 136 400 134 376 C 146 404 128 420 124 436 Z" />
      <ellipse cx="560" cy="446" rx="34" ry="12" />
      <ellipse cx="250" cy="446" rx="22" ry="8" />
    </g>

    <!-- Ink cloud behind the animal, only at the highest alarm -->
    <g id="sp-ink" opacity="0">
      <ellipse cx="640" cy="250" rx="130" ry="95" fill="url(#sp-ink-gradient)" />
      <ellipse cx="700" cy="200" rx="80" ry="60" fill="url(#sp-ink-gradient)" />
      <ellipse cx="690" cy="310" rx="90" ry="55" fill="url(#sp-ink-gradient)" />
    </g>

    <!-- Animal, prey and bubbles, drawn small and enlarged as a whole -->
    <g transform="translate(-126 -80) scale(1.3)">
    <!-- Prey and tentacles: only while hunting -->
    <g id="sp-prey" opacity="0">
      <path d="M 152 262 C 160 248 184 246 198 254 C 206 258 206 266 198 270 C 184 278 160 276 152 262 Z" fill="#f28c6b" />
      <path d="M 198 254 L 212 246 L 210 262 L 212 278 L 198 270 Z" fill="#e2704f" />
      <path d="M 152 258 C 140 244 130 238 118 236 M 152 262 C 138 256 126 256 114 260" stroke="#f6b49d" stroke-width="1.5" fill="none" />
      <circle cx="162" cy="258" r="2.2" fill="#1b0f0a" />
    </g>
    <g id="sp-tentacles" fill="#e6b3a0" opacity="0">
      <path d="M 296 258 C 260 254 230 256 214 258 C 206 255 198 252 192 256 C 198 262 206 262 214 262 C 230 262 260 262 296 266 Z" />
      <path d="M 296 262 C 260 264 230 268 214 268 C 206 266 196 266 192 270 C 198 275 206 274 214 272 C 230 272 260 272 296 270 Z" />
    </g>

    <!-- The cuttlefish -->
    <g id="sp-cuttle">
      <!-- Undulating fin skirt around the mantle -->
      <path id="sp-fin" d="M618.0 260.0 Q630.8 263.4 617.4 266.3 Q612.9 269.1 615.8 272.5 Q627.2 277.0 613.0 278.6 Q607.5 281.1 609.2 284.6 Q618.9 290.0 604.3 290.4 Q598.1 292.4 598.4 296.0 Q606.1 302.1 591.6 301.3 Q584.7 302.7 583.8 306.3 Q589.2 313.0 575.2 310.9 Q568.0 311.7 565.8 315.2 Q568.8 322.2 555.7 319.0 Q548.4 319.1 545.0 322.4 Q545.4 329.5 533.7 325.3 Q526.4 324.7 521.9 327.7 Q519.8 334.8 509.8 329.5 Q502.8 328.4 497.4 330.9 Q492.8 337.7 484.7 331.7 Q478.2 330.0 472.0 332.0 Q465.1 338.3 459.3 331.7 Q453.5 329.5 446.6 330.9 Q437.6 336.5 434.2 329.5 Q429.3 326.8 422.1 327.7 Q411.2 332.4 410.3 325.3 Q406.4 322.2 399.0 322.4 Q386.6 326.1 388.3 319.0 Q385.5 315.6 378.2 315.2 Q364.6 317.8 368.8 310.9 Q367.2 307.3 360.2 306.3 Q345.9 307.7 352.4 301.3 Q352.1 297.7 345.6 296.0 Q331.0 296.2 339.7 290.4 Q340.7 286.8 334.8 284.6 Q320.4 283.6 331.0 278.6 Q333.3 275.2 328.2 272.5 Q314.4 270.2 326.6 266.3 Q330.0 263.1 326.0 260.0 Q313.2 256.6 326.6 253.7 Q331.1 250.9 328.2 247.5 Q316.8 243.0 331.0 241.4 Q336.5 238.9 334.8 235.4 Q325.1 230.0 339.7 229.6 Q345.9 227.6 345.6 224.0 Q337.9 217.9 352.4 218.7 Q359.3 217.3 360.2 213.7 Q354.8 207.0 368.8 209.1 Q376.0 208.3 378.2 204.8 Q375.2 197.8 388.3 201.0 Q395.6 200.9 399.0 197.6 Q398.6 190.5 410.3 194.7 Q417.6 195.3 422.1 192.3 Q424.2 185.2 434.2 190.5 Q441.2 191.6 446.6 189.1 Q451.2 182.3 459.3 188.3 Q465.8 190.0 472.0 188.0 Q478.9 181.7 484.7 188.3 Q490.5 190.5 497.4 189.1 Q506.4 183.5 509.8 190.5 Q514.7 193.2 521.9 192.3 Q532.8 187.6 533.7 194.7 Q537.6 197.8 545.0 197.6 Q557.4 193.9 555.7 201.0 Q558.5 204.4 565.8 204.8 Q579.4 202.2 575.2 209.1 Q576.8 212.7 583.8 213.7 Q598.1 212.3 591.6 218.7 Q591.9 222.3 598.4 224.0 Q613.0 223.8 604.3 229.6 Q603.3 233.2 609.2 235.4 Q623.6 236.4 613.0 241.4 Q610.7 244.8 615.8 247.5 Q629.6 249.8 617.4 253.7 Q614.0 256.9 618.0 260.0Z" fill="#a8eadf" fill-opacity="0.35" stroke="#a8eadf" stroke-opacity="0.7" stroke-width="1.5" stroke-linejoin="round" />

      <!-- Arms converging to a tip, flared in the threat display -->
      <g id="sp-arms" fill="#6fd3c3">
        <path d="M 302 240 C 276 234 248 244 224 258 C 250 250 276 248 300 252 Z" />
        <path d="M 300 250 C 270 248 244 256 216 264 C 244 262 272 262 300 260 Z" />
        <path d="M 300 262 C 272 264 244 268 214 270 C 244 274 272 274 300 270 Z" />
        <path d="M 300 270 C 274 278 248 282 220 278 C 248 288 278 286 302 278 Z" />
        <path d="M 304 278 C 282 290 256 294 230 286 C 256 300 284 298 308 284 Z" />
        <path d="M 302 256 C 280 258 258 262 236 266 C 258 268 280 268 302 266 Z" opacity="0.6" />
      </g>

      <!-- Mantle with its skin patterns -->
      <path id="sp-mantle" d="M 340 260 C 340 205 420 195 500 200 C 560 204 602 230 602 260 C 602 290 560 316 500 320 C 420 325 340 315 340 260 Z" fill="#57c5b6" />
      <g clip-path="url(#sp-mantle-clip)">
        <!-- Calm: soft mottling -->
        <g id="sp-mottle" fill="#e9fff9" opacity="1">
          <circle cx="372" cy="238" r="6" opacity="0.35" />
          <circle cx="396" cy="222" r="4" opacity="0.4" />
          <circle cx="410" cy="252" r="8" opacity="0.25" />
          <circle cx="440" cy="216" r="5" opacity="0.4" />
          <circle cx="452" cy="276" r="7" opacity="0.3" />
          <circle cx="470" cy="240" r="4" opacity="0.45" />
          <circle cx="492" cy="214" r="6" opacity="0.3" />
          <circle cx="506" cy="262" r="9" opacity="0.22" />
          <circle cx="528" cy="232" r="5" opacity="0.4" />
          <circle cx="540" cy="290" r="6" opacity="0.3" />
          <circle cx="560" cy="252" r="4" opacity="0.45" />
          <circle cx="578" cy="270" r="5" opacity="0.35" />
          <circle cx="384" cy="290" r="5" opacity="0.3" />
          <circle cx="420" cy="300" r="4" opacity="0.35" />
          <circle cx="480" cy="300" r="5" opacity="0.3" />
          <circle cx="572" cy="226" r="3" opacity="0.4" />
        </g>
        <!-- Agitated: dark zebra bands -->
        <g id="sp-stripes" fill="#14060c" opacity="0">
          <path d="M 380 195 C 388 230 372 290 380 325 L 392 325 C 384 290 400 230 392 195 Z" opacity="0.55" />
          <path d="M 410 195 C 420 230 402 290 412 325 L 428 325 C 418 290 436 230 426 195 Z" opacity="0.6" />
          <path d="M 446 195 C 456 230 438 290 448 325 L 466 325 C 456 290 474 230 464 195 Z" opacity="0.65" />
          <path d="M 486 195 C 496 230 478 290 488 325 L 506 325 C 496 290 514 230 504 195 Z" opacity="0.65" />
          <path d="M 526 195 C 536 230 518 290 528 325 L 544 325 C 534 290 552 230 542 195 Z" opacity="0.6" />
          <path d="M 562 195 C 570 230 556 290 564 325 L 576 325 C 568 290 584 230 576 195 Z" opacity="0.55" />
        </g>
        <!-- Threat display: eye spots -->
        <g id="sp-eyespots" opacity="0">
          <ellipse cx="462" cy="246" rx="17" ry="12" fill="#080305" stroke="#f6e7bd" stroke-width="3.5" />
          <ellipse cx="538" cy="246" rx="17" ry="12" fill="#080305" stroke="#f6e7bd" stroke-width="3.5" />
          <circle cx="457" cy="242" r="3" fill="#f6e7bd" />
          <circle cx="533" cy="242" r="3" fill="#f6e7bd" />
        </g>
        <!-- Volume: light from above, shadow below -->
        <rect x="330" y="190" width="290" height="140" fill="url(#sp-volume)" />
        <!-- Shine along the back -->
        <path d="M 370 222 C 420 204 520 202 580 228" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="5" stroke-linecap="round" />
      </g>
      <!-- Iridescent rim along the mantle -->
      <path id="sp-rim" d="M 352 240 C 380 210 450 200 500 202 C 552 205 590 226 598 248" fill="none" stroke="#c9fff6" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

      <!-- Head with the W-shaped pupil -->
      <path id="sp-head" d="M 352 262 C 352 236 338 222 318 224 C 298 226 290 246 292 262 C 290 280 300 298 320 300 C 340 302 352 288 352 262 Z" fill="#6fd3c3" />
      <path d="M 352 262 C 352 236 338 222 318 224 C 298 226 290 246 292 262 C 290 280 300 298 320 300 C 340 302 352 288 352 262 Z" fill="url(#sp-volume)" />
      <ellipse cx="324" cy="248" rx="17" ry="13" fill="#ead690" stroke="#1b2a26" stroke-opacity="0.35" stroke-width="2" />
      <path id="sp-pupil" d="M 309 245 C 313 254 318 255 321 250 C 323 253 325 253 327 250 C 330 255 335 254 339 245 C 331 240 317 240 309 245 Z" fill="#0d0a08" />
      <circle cx="318" cy="243" r="2.2" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- Bubbles from the siphon: the more stress, the more breathing -->
    <g id="sp-bubbles" fill="none" stroke="#d8fbff" stroke-width="1.5" opacity="0.2">
      <circle cx="372" cy="300" r="4" />
      <circle cx="380" cy="282" r="3" />
      <circle cx="368" cy="262" r="5" />
      <circle cx="384" cy="238" r="3" />
      <circle cx="374" cy="214" r="4" />
      <circle cx="388" cy="186" r="2.5" />
    </g>
    </g>
  </g>

  <!-- Title -->
  <text x="40" y="54" font-size="13" letter-spacing="6" fill="#c9fff6" opacity="0.85">SEPIA</text>
  <text x="40" y="80" font-size="22" font-weight="300" fill="#ffffff">Stimmungsbarometer</text>

  <!-- Daylight readout -->
  <g transform="translate(672 34)">
    <rect width="96" height="40" rx="10" fill="url(#sp-panel)" stroke="#c9fff6" stroke-opacity="0.25" />
    <circle cx="20" cy="20" r="6" fill="#ffe08a" />
    <g stroke="#ffe08a" stroke-width="1.6" stroke-linecap="round">
      <line x1="20" y1="7" x2="20" y2="10" />
      <line x1="20" y1="30" x2="20" y2="33" />
      <line x1="7" y1="20" x2="10" y2="20" />
      <line x1="30" y1="20" x2="33" y2="20" />
    </g>
    <text id="sp-daylight-value" x="64" y="26" text-anchor="end" font-size="17" fill="#ffffff">70</text>
    <text x="68" y="26" font-size="11" fill="#c9fff6">%</text>
  </g>

  <!-- Hunting hint -->
  <text id="sp-hunt-text" x="400" y="120" text-anchor="middle" font-size="15" letter-spacing="3" fill="#ffd3c2" opacity="0">BEUTE IN SICHT</text>

  <!-- Readout panel -->
  <g transform="translate(32 380)">
    <rect width="268" height="92" rx="14" fill="url(#sp-panel)" stroke="#c9fff6" stroke-opacity="0.25" />
    <text id="sp-label" x="20" y="28" font-size="12" letter-spacing="3" fill="#c9fff6">CPU-LAST</text>
    <text id="sp-value" x="20" y="64" font-size="34" font-weight="600" fill="#ffffff">15</text>
    <text x="84" y="64" font-size="15" fill="#c9fff6">%</text>
    <text id="sp-mood" x="248" y="64" text-anchor="end" font-size="16" fill="#ffffff">gelassen</text>
    <rect x="20" y="74" width="228" height="5" rx="2.5" fill="#ffffff" opacity="0.15" />
    <rect id="sp-bar" x="20" y="74" width="228" height="5" rx="2.5" fill="#57c5b6" />
  </g>
</svg>
