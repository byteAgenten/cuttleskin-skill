
<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 15 270 270" width="270" height="270">
  <style>
    .face { fill: #111827; stroke: #374151; stroke-width: 2; }
    .band { fill: none; stroke: #22c55e; stroke-width: 14; stroke-linecap: round; }
    .tick-major { stroke: #f9fafb; stroke-width: 3; }
    .tick-minor { stroke: #9ca3af; stroke-width: 1.5; }
    .tick-label {
      fill: #d1d5db;
      font: 600 11px system-ui, sans-serif;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .needle { fill: #f97316; }
    .hub { fill: #e5e7eb; stroke: #111827; stroke-width: 2; }
    .value { fill: #f9fafb; font: 700 30px system-ui, sans-serif; text-anchor: middle; }
    .unit { fill: #9ca3af; font: 500 12px system-ui, sans-serif; text-anchor: middle; }
  </style>

  <!-- Dial face -->
  <circle class="face" cx="150" cy="150" r="133" />

  <!-- Colored arc segment from 0 to 200 km/h (-120deg to +120deg), stroke color driven by cuttleskin -->
  <path id="speed-band" class="band" d="M 46.08 210 A 120 120 0 1 1 253.92 210" />

  <!-- Scale: major ticks every 20 km/h, minor ticks every 10 km/h -->
  <g id="scale">
    <line x1="56.47" y1="204" x2="68.59" y2="197" class="tick-major" />
    <text x="80.72" y="190" class="tick-label">0</text>
    <line x1="47.29" y1="183.37" x2="54.89" y2="180.9" class="tick-minor" />
    <line x1="42.59" y1="161.29" x2="56.51" y2="159.83" class="tick-major" />
    <text x="70.44" y="158.36" class="tick-label">20</text>
    <line x1="42.59" y1="138.71" x2="50.55" y2="139.55" class="tick-minor" />
    <line x1="47.29" y1="116.63" x2="60.6" y2="120.95" class="tick-major" />
    <text x="73.92" y="125.28" class="tick-label">40</text>
    <line x1="56.47" y1="96" x2="63.4" y2="100" class="tick-minor" />
    <line x1="69.74" y1="77.73" x2="80.14" y2="87.1" class="tick-major" />
    <text x="90.55" y="96.47" class="tick-label">60</text>
    <line x1="86.52" y1="62.63" x2="91.22" y2="69.1" class="tick-minor" />
    <line x1="106.07" y1="51.34" x2="111.77" y2="64.13" class="tick-major" />
    <text x="117.46" y="76.92" class="tick-label">80</text>
    <line x1="127.55" y1="44.36" x2="129.21" y2="52.19" class="tick-minor" />
    <line x1="150" y1="42" x2="150" y2="56" class="tick-major" />
    <text x="150" y="70" class="tick-label">100</text>
    <line x1="172.45" y1="44.36" x2="170.79" y2="52.19" class="tick-minor" />
    <line x1="193.93" y1="51.34" x2="188.23" y2="64.13" class="tick-major" />
    <text x="182.54" y="76.92" class="tick-label">120</text>
    <line x1="213.48" y1="62.63" x2="208.78" y2="69.1" class="tick-minor" />
    <line x1="230.26" y1="77.73" x2="219.86" y2="87.1" class="tick-major" />
    <text x="209.45" y="96.47" class="tick-label">140</text>
    <line x1="243.53" y1="96" x2="236.6" y2="100" class="tick-minor" />
    <line x1="252.71" y1="116.63" x2="239.4" y2="120.95" class="tick-major" />
    <text x="226.08" y="125.28" class="tick-label">160</text>
    <line x1="257.41" y1="138.71" x2="249.45" y2="139.55" class="tick-minor" />
    <line x1="257.41" y1="161.29" x2="243.49" y2="159.83" class="tick-major" />
    <text x="229.56" y="158.36" class="tick-label">180</text>
    <line x1="252.71" y1="183.37" x2="245.11" y2="180.9" class="tick-minor" />
    <line x1="243.53" y1="204" x2="231.41" y2="197" class="tick-major" />
    <text x="219.28" y="190" class="tick-label">200</text>
  </g>

  <!-- Needle drawn pointing straight up (100 km/h); cuttleskin rotates it around the hub at (150, 150) -->
  <path id="needle" class="needle" d="M 150 50 L 156 150 L 150 165 L 144 150 Z" />
  <circle class="hub" cx="150" cy="150" r="10" />

  <!-- Digital readout, text bound to the variable by cuttleskin -->
  <text id="speed-text" class="value" x="150" y="222">0</text>
  <text class="unit" x="150" y="242">km/h</text>
</svg>
