<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif">
  <defs>
    <linearGradient id="wo-parchment-grad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f6e9c8" />
      <stop offset="0.55" stop-color="#e6cf9c" />
      <stop offset="1" stop-color="#d2b077" />
    </linearGradient>
    <radialGradient id="wo-vignette-grad" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0.55" stop-color="#7a4e1e" stop-opacity="0" />
      <stop offset="1" stop-color="#6b3f12" stop-opacity="0.5" />
    </radialGradient>
    <radialGradient id="wo-halo-grad">
      <stop offset="0" stop-color="#ffe7a3" stop-opacity="0.95" />
      <stop offset="0.45" stop-color="#ffbf55" stop-opacity="0.35" />
      <stop offset="1" stop-color="#ff9a2e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="wo-flame-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7cf" />
      <stop offset="0.45" stop-color="#ffcb4d" />
      <stop offset="1" stop-color="#e8641a" />
    </linearGradient>
    <linearGradient id="wo-wood-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3517" />
      <stop offset="0.5" stop-color="#7a4b22" />
      <stop offset="1" stop-color="#5a3517" />
    </linearGradient>
    <linearGradient id="wo-brass-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3be6a" />
      <stop offset="1" stop-color="#9a6d22" />
    </linearGradient>
    <filter id="wo-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="wo-flask-clip">
      <circle cx="320" cy="290" r="56" />
    </clipPath>
    <path id="wo-star-shape" d="M0 -6 L1.6 -1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6 -1.6 Z" />
  </defs>

  <!-- Desk behind the parchment -->
  <rect width="640" height="450" fill="#1a110a" />

  <!-- Parchment with uneven edges -->
  <path
    d="M34 24 C120 16 200 30 320 20 C430 14 520 28 608 22 C618 110 610 210 618 310 C612 370 620 410 610 430 C500 438 420 426 320 434 C220 440 120 428 30 432 C22 340 30 250 24 160 C30 96 20 54 34 24 Z"
    fill="url(#wo-parchment-grad)"
    stroke="#5b3a17"
    stroke-width="2"
  />
  <path
    d="M34 24 C120 16 200 30 320 20 C430 14 520 28 608 22 C618 110 610 210 618 310 C612 370 620 410 610 430 C500 438 420 426 320 434 C220 440 120 428 30 432 C22 340 30 250 24 160 C30 96 20 54 34 24 Z"
    fill="url(#wo-vignette-grad)"
  />
  <!-- Darkens the parchment in dim light -->
  <path
    id="wo-dim"
    d="M34 24 C120 16 200 30 320 20 C430 14 520 28 608 22 C618 110 610 210 618 310 C612 370 620 410 610 430 C500 438 420 426 320 434 C220 440 120 428 30 432 C22 340 30 250 24 160 C30 96 20 54 34 24 Z"
    fill="#140b04"
    opacity="0.05"
  />

  <!-- Double frame with brass rosettes in the corners -->
  <rect x="48" y="40" width="544" height="380" rx="6" fill="none" stroke="#7a5426" stroke-width="1.6" />
  <rect x="55" y="47" width="530" height="366" rx="4" fill="none" stroke="#a07c46" stroke-width="0.8" stroke-dasharray="1 4" />
  <g fill="url(#wo-brass-grad)" stroke="#6b4a1c" stroke-width="0.8">
    <circle cx="48" cy="40" r="7" />
    <circle cx="592" cy="40" r="7" />
    <circle cx="48" cy="420" r="7" />
    <circle cx="592" cy="420" r="7" />
  </g>

  <!-- Night sky: stars and moon fade out as the light grows -->
  <g id="wo-stars" fill="#b8892f" opacity="0.1">
    <use href="#wo-star-shape" transform="translate(96 74) scale(0.9)" />
    <use href="#wo-star-shape" transform="translate(128 98) scale(0.6)" />
    <use href="#wo-star-shape" transform="translate(160 66) scale(0.7)" />
    <use href="#wo-star-shape" transform="translate(484 66) scale(0.7)" />
    <use href="#wo-star-shape" transform="translate(514 98) scale(0.6)" />
    <use href="#wo-star-shape" transform="translate(546 72) scale(0.9)" />
    <path d="M90 64 A13 13 0 0 0 90 90 A8 13 0 0 1 90 64 Z" />
    <path d="M550 64 A13 13 0 0 1 550 90 A8 13 0 0 0 550 64 Z" />
  </g>

  <!-- Title -->
  <text x="320" y="80" text-anchor="middle" font-size="30" font-style="italic" fill="#4a2c10" letter-spacing="1">Das Wetterorakel</text>
  <text x="320" y="100" text-anchor="middle" font-size="11" fill="#7a5426" letter-spacing="3">~ WÄRME · FEUCHTE · LICHT ~</text>

  <!-- Dividers between the instruments -->
  <g stroke="#a07c46" stroke-width="1.2" stroke-dasharray="2 5" stroke-linecap="round">
    <line x1="240" y1="130" x2="240" y2="380" />
    <line x1="400" y1="130" x2="400" y2="380" />
  </g>

  <!-- Instrument labels -->
  <g font-size="13" fill="#5b3a17" text-anchor="middle" letter-spacing="2">
    <text x="160" y="122">WÄRME</text>
    <text x="320" y="122">FEUCHTE</text>
    <text x="480" y="122">LICHT</text>
  </g>

  <!-- ===== Temperature: alchemist's thermometer on a wooden board ===== -->
  <rect x="116" y="130" width="88" height="232" rx="10" fill="url(#wo-wood-grad)" stroke="#3b2410" stroke-width="1.5" />
  <circle cx="160" cy="140" r="3" fill="url(#wo-brass-grad)" />
  <circle cx="160" cy="352" r="3" fill="url(#wo-brass-grad)" />
  <!-- Scale: y = 316 - (T + 20) * 2.3143 -->
  <g stroke="#f1dfb5" stroke-width="1">
    <line x1="152" y1="316" x2="164" y2="316" />
    <line x1="152" y1="292.9" x2="164" y2="292.9" />
    <line x1="152" y1="269.7" x2="164" y2="269.7" />
    <line x1="152" y1="246.6" x2="164" y2="246.6" />
    <line x1="152" y1="223.4" x2="164" y2="223.4" />
    <line x1="152" y1="200.3" x2="164" y2="200.3" />
    <line x1="152" y1="177.1" x2="164" y2="177.1" />
    <line x1="152" y1="154" x2="164" y2="154" />
    <line x1="158" y1="304.4" x2="164" y2="304.4" />
    <line x1="158" y1="281.3" x2="164" y2="281.3" />
    <line x1="158" y1="258.1" x2="164" y2="258.1" />
    <line x1="158" y1="235" x2="164" y2="235" />
    <line x1="158" y1="211.9" x2="164" y2="211.9" />
    <line x1="158" y1="188.7" x2="164" y2="188.7" />
    <line x1="158" y1="165.6" x2="164" y2="165.6" />
  </g>
  <g font-size="9" fill="#f1dfb5" text-anchor="end">
    <text x="149" y="319">−20</text>
    <text x="149" y="295.9">−10</text>
    <text x="149" y="272.7">0</text>
    <text x="149" y="249.6">10</text>
    <text x="149" y="226.4">20</text>
    <text x="149" y="203.3">30</text>
    <text x="149" y="180.1">40</text>
    <text x="149" y="157">50</text>
  </g>
  <!-- Glass tube, liquid column (drawn at 21 °C) and bulb -->
  <rect x="165" y="142" width="14" height="190" rx="7" fill="#fdf8ec" fill-opacity="0.55" stroke="#3b2410" stroke-width="1.5" />
  <rect id="wo-temp-column" x="168" y="221.11" width="8" height="108.89" fill="#dc981f" />
  <circle id="wo-temp-bulb" cx="172" cy="338" r="15" fill="#dc981f" stroke="#3b2410" stroke-width="1.5" />
  <rect x="167.5" y="146" width="2.5" height="180" rx="1.2" fill="#ffffff" opacity="0.45" />
  <circle cx="167" cy="333" r="4" fill="#ffffff" opacity="0.4" />
  <rect x="163" y="134" width="18" height="9" rx="2" fill="url(#wo-brass-grad)" stroke="#6b4a1c" stroke-width="0.8" />
  <!-- Readout -->
  <text x="160" y="394" text-anchor="middle" font-size="24" fill="#3d240c"><tspan id="wo-temp-value">21</tspan><tspan font-size="14">°C</tspan></text>
  <text id="wo-temp-status" x="160" y="411" text-anchor="middle" font-size="11" font-style="italic" fill="#7a5426">behaglich</text>

  <!-- ===== Humidity: potion flask ===== -->
  <!-- Vapor rising from the cork -->
  <g id="wo-hum-vapor" fill="none" stroke="#8fa9a2" stroke-width="2" stroke-linecap="round" opacity="0.11">
    <path d="M314 146 C306 138 322 132 312 124" />
    <path d="M322 146 C330 136 316 132 326 122" />
    <path d="M328 147 C336 141 330 135 336 129" />
  </g>
  <!-- Brass stand -->
  <path d="M290 346 L280 368 M350 346 L360 368" stroke="#7a5426" stroke-width="3" stroke-linecap="round" />
  <ellipse cx="320" cy="368" rx="50" ry="6" fill="url(#wo-brass-grad)" stroke="#6b4a1c" stroke-width="0.8" />
  <!-- Liquid, clipped to the bulb; drawn at 45 % -->
  <g clip-path="url(#wo-flask-clip)">
    <rect x="262" y="234" width="116" height="112" fill="#efe6cf" opacity="0.5" />
    <g id="wo-hum-liquid" fill="#2f9e6e">
      <path d="M262 295.6 q14.5 -5 29 0 t29 0 t29 0 t29 0 V430 H262 Z" />
      <path d="M262 295.6 q14.5 -5 29 0 t29 0 t29 0 t29 0" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5" />
    </g>
    <g id="wo-hum-bubbles" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.25">
      <circle cx="296" cy="330" r="3" />
      <circle cx="306" cy="314" r="2" />
      <circle cx="330" cy="336" r="4" />
      <circle cx="342" cy="318" r="2.5" />
      <circle cx="320" cy="324" r="1.8" />
      <circle cx="352" cy="334" r="2" />
    </g>
  </g>
  <!-- Glass outline: neck and round bulb -->
  <path d="M306 172 L306 231.66 A60 60 0 1 0 334 231.66 L334 172 Z" fill="#e8f1ee" fill-opacity="0.18" stroke="#3b2410" stroke-width="2" stroke-linejoin="round" />
  <path d="M284 262 A44 44 0 0 0 278 300" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" />
  <rect x="301" y="166" width="38" height="8" rx="3" fill="url(#wo-brass-grad)" stroke="#6b4a1c" stroke-width="0.8" />
  <rect x="309" y="150" width="22" height="17" rx="3" fill="#9b6b3c" stroke="#5b3a17" stroke-width="1" />
  <!-- Readout -->
  <text x="320" y="394" text-anchor="middle" font-size="24" fill="#3d240c"><tspan id="wo-hum-value">45</tspan><tspan font-size="14"> %</tspan></text>
  <text id="wo-hum-status" x="320" y="411" text-anchor="middle" font-size="11" font-style="italic" fill="#7a5426">ausgewogen</text>

  <!-- ===== Light: candle in a brass holder ===== -->
  <circle id="wo-light-halo" cx="480" cy="226" r="70" fill="url(#wo-halo-grad)" opacity="0.6" />
  <circle cx="533" cy="346" r="8" fill="none" stroke="url(#wo-brass-grad)" stroke-width="3" />
  <ellipse cx="480" cy="352" rx="48" ry="9" fill="url(#wo-brass-grad)" stroke="#6b4a1c" stroke-width="0.8" />
  <rect x="462" y="260" width="36" height="90" rx="2" fill="#f1e4c4" stroke="#b9a37a" stroke-width="1" />
  <ellipse cx="480" cy="260" rx="18" ry="4" fill="#f8eed6" stroke="#b9a37a" stroke-width="0.8" />
  <path d="M465 262 v14 a2.5 2.5 0 0 0 5 0 v-12 Z M488 263 v22 a2.5 2.5 0 0 0 5 0 v-20 Z" fill="#f8eed6" />
  <path d="M480 258 q1.5 -5 -0.5 -9" fill="none" stroke="#2b1b0e" stroke-width="2" stroke-linecap="round" />
  <!-- Flame, drawn at 300 lx; scales from its base -->
  <g id="wo-light-flame" filter="url(#wo-glow)">
    <path d="M480 196 C490 212 495 226 494 236 C493 246 487 251 480 251 C473 251 467 246 466 236 C465 226 470 212 480 196 Z" fill="url(#wo-flame-grad)" />
    <path d="M480 220 C485 230 487 238 486 243 C485 248 482 250 480 250 C478 250 475 248 474 243 C473 238 475 230 480 220 Z" fill="#fff8dc" opacity="0.9" />
    <ellipse cx="480" cy="247" rx="4" ry="3" fill="#4f7fd6" opacity="0.7" />
  </g>
  <!-- Readout -->
  <text x="480" y="394" text-anchor="middle" font-size="24" fill="#3d240c"><tspan id="wo-light-value">300</tspan><tspan font-size="14"> lx</tspan></text>
  <text id="wo-light-status" x="480" y="411" text-anchor="middle" font-size="11" font-style="italic" fill="#7a5426">hell</text>
</svg>
